<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDPN Admin — Editor de Contenido</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a1f35;
            --bg-input: #0d1225;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #1e293b;
            --border-hover: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        .header-badge {
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-dot.error { background: var(--danger); }
        .status-dot.loading { background: var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: calc(100vh - 60px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            padding: 0 0.5rem;
        }

        .file-tree {
            list-style: none;
        }

        .file-item {
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            transition: all 0.15s;
            margin-bottom: 2px;
        }

        .file-item:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .file-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
        }

        .file-item i {
            width: 16px;
            text-align: center;
            font-size: 0.8rem;
        }

        .folder { color: var(--warning); }
        .file-md { color: var(--accent); }

        .folder-children {
            list-style: none;
            padding-left: 1.25rem;
        }

        /* Main Editor */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .editor-toolbar-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .file-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .editor-toolbar-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover { background: #059669; }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.8rem;
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        .editor-pane, .preview-pane {
            overflow-y: auto;
            padding: 1.5rem;
        }

        .editor-pane {
            border-right: 1px solid var(--border);
        }

        .pane-header {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .editor-textarea {
            width: 100%;
            min-height: calc(100vh - 200px);
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 2;
        }

        .editor-textarea:focus {
            border-color: var(--accent);
        }

        .preview-content {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            min-height: calc(100vh - 200px);
            line-height: 1.7;
        }

        .preview-content h1 { font-size: 1.75rem; margin: 1.5rem 0 1rem; }
        .preview-content h2 { font-size: 1.5rem; margin: 1.25rem 0 0.75rem; color: var(--accent); }
        .preview-content h3 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
        .preview-content p { margin: 0.75rem 0; color: var(--text-secondary); }
        .preview-content code {
            background: rgba(59, 130, 246, 0.1);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: var(--accent);
        }
        .preview-content pre {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        .preview-content pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }
        .preview-content ul, .preview-content ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
            color: var(--text-secondary);
        }
        .preview-content li { margin: 0.25rem 0; }
        .preview-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .preview-content th, .preview-content td {
            border: 1px solid var(--border);
            padding: 0.5rem 0.75rem;
            text-align: left;
            font-size: 0.875rem;
        }
        .preview-content th {
            background: var(--bg-card);
            color: var(--text-primary);
            font-weight: 600;
        }
        .preview-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--text-muted);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            width: 90%;
            max-width: 500px;
        }

        .modal h3 {
            margin-bottom: 1rem;
        }

        .modal-input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .modal-input:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 300;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }

        /* Responsive */
        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .editor-container { grid-template-columns: 1fr; }
            .preview-pane { display: none; }
        }
    </style>
</head>

<!-- Header -->
<header class="header">
    <div class="header-left">
        <a href="/" class="logo"><i class="fas fa-shield-halved"></i> CDPN</a>
        <span class="header-badge">Admin</span>
    </div>
    <div class="header-right">
        <div class="status" id="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Conectado a GitHub</span>
        </div>
        <a href="https://github.com/0xvanguard/CyberDefense-Pro-Network" target="_blank" class="btn btn-ghost btn-sm">
            <i class="fab fa-github"></i> Repo
        </a>
    </div>
</header>

<!-- Layout -->
<div class="layout">
    <!-- Sidebar: File Tree -->
    <aside class="sidebar">
        <div class="sidebar-title">📁 Contenido</div>
        <ul class="file-tree" id="fileTree">
            <!-- Populated by JS -->
        </ul>
    </aside>

    <!-- Main Editor -->
    <main class="main">
        <div class="editor-toolbar" id="editorToolbar" style="display: none;">
            <div class="editor-toolbar-left">
                <span class="file-path" id="currentFile">—</span>
                <span id="modifiedBadge" style="display:none; color: var(--warning); font-size: 0.8rem;">
                    <i class="fas fa-circle"></i> Modificado
                </span>
            </div>
            <div class="editor-toolbar-right">
                <button class="btn btn-ghost btn-sm" onclick="openInGitHub()" title="Abrir en GitHub">
                    <i class="fab fa-github"></i> GitHub
                </button>
                <button class="btn btn-ghost btn-sm" onclick="revertChanges()" title="Deshacer cambios">
                    <i class="fas fa-undo"></i> Revertir
                </button>
                <button class="btn btn-success btn-sm" onclick="saveFile()" id="saveBtn">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </div>

        <div class="editor-container" id="editorContainer" style="display: none;">
            <div class="editor-pane">
                <div class="editor-header">
                    <span class="pane-header"><i class="fas fa-edit"></i> Editor Markdown</span>
                </div>
                <textarea class="editor-textarea" id="editor" spellcheck="false" 
                    placeholder="Selecciona un archivo para编辑ar..."></textarea>
            </div>
            <div class="preview-pane">
                <div class="pane-header"><i class="fas fa-eye"></i> Vista Previa</div>
                <div class="preview-content" id="preview"></div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-file-edit"></i>
            <h3>Selecciona un archivo</h3>
            <p>Elige un archivo Markdown del panel izquierdo para comenzar a editar</p>
        </div>
    </main>
</div>

<!-- Commit Modal -->
<div class="modal-overlay" id="commitModal">
    <div class="modal">
        <h3><i class="fas fa-paper-plane"></i> Guardar Cambios</h3>
        <input type="text" class="modal-input" id="commitMessage" placeholder="Mensaje del commit (ej: Actualiza módulo Red Team)">
        <div class="modal-actions">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-success" onclick="confirmSave()" id="confirmBtn">
                <i class="fas fa-check"></i> Confirmar
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastText">Guardado correctamente</span>
</div>

// ===== GITHUB API =====
const API_BASE = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`;

async function githubFetch(path) {
    const url = `${API_BASE}/contents/${path}?ref=${BRANCH}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    return res.json();
}

function toGitHubPath(displayPath) {
    return GITHUB_PATHS[displayPath] || displayPath;
}

function toGitHubEditUrl(displayPath) {
    const ghPath = toGitHubPath(displayPath);
    return `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/edit/main/${ghPath}`;
}

async function getFileContent(filePath) {
    const githubPath = toGitHubPath(filePath);
    const data = await githubFetch(githubPath);
    const content = atob(data.content);
    currentSha = data.sha;
    return content;
}

async function saveFileToGitHub(filePath, content, message) {
    const githubPath = toGitHubPath(filePath);
    const encodedContent = btoa(unescape(encodeURIComponent(content)));
    
    const res = await fetch(`${API_BASE}/contents/${githubPath}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            message: message || `Update ${filePath} via CDPN Admin`,
            content: encodedContent,
            sha: currentSha,
            branch: BRANCH,
        }),
    });

    if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || 'Failed to save');
    }

    return res.json();
}

// ===== UI FUNCTIONS =====
function renderFileTree() {
    const tree = document.getElementById('fileTree');
    tree.innerHTML = '';
    
    FILE_TREE.forEach(item => {
        tree.appendChild(createTreeItem(item, 0));
    });
}

function createTreeItem(item, depth) {
    if (item.type === 'folder') {
        const li = document.createElement('li');
        const div = document.createElement('div');
        div.className = 'file-item';
        div.style.paddingLeft = `${0.75 + depth * 1.25}rem`;
        div.innerHTML = `<i class="fas fa-chevron-right folder" style="font-size:0.6rem; transition: transform 0.2s;"></i> <i class="fas fa-folder folder"></i> ${item.name}`;
        
        const childList = document.createElement('ul');
        childList.className = 'folder-children';
        childList.style.display = 'none';
        
        if (item.children) {
            item.children.forEach(child => {
                childList.appendChild(createTreeItem(child, depth + 1));
            });
        }
        
        div.addEventListener('click', () => {
            const icon = div.querySelector('.fa-chevron-right');
            const isOpen = childList.style.display !== 'none';
            childList.style.display = isOpen ? 'none' : 'block';
            icon.style.transform = isOpen ? '' : 'rotate(90deg)';
        });
        
        li.appendChild(div);
        li.appendChild(childList);
        return li;
    } else {
        const li = document.createElement('li');
        const div = document.createElement('div');
        div.className = 'file-item';
        div.style.paddingLeft = `${0.75 + depth * 1.25}rem`;
        div.innerHTML = `<i class="fas fa-file-alt file-md"></i> ${item.name}`;
        div.dataset.path = item.path;
        
        div.addEventListener('click', () => loadFile(item.path));
        
        li.appendChild(div);
        return li;
    }
}

async function loadFile(filePath) {
    if (isModified) {
        if (!confirm('Tienes cambios sin guardar. ¿Deseas continuar?')) return;
    }
    
    setStatus('loading', 'Cargando...');
    
    try {
        const content = await getFileContent(filePath);
        
        currentFilePath = filePath;
        originalContent = content;
        isModified = false;
        
        document.getElementById('editor').value = content;
        document.getElementById('currentFile').textContent = filePath;
        document.getElementById('modifiedBadge').style.display = 'none';
        document.getElementById('editorToolbar').style.display = 'flex';
        document.getElementById('editorContainer').style.display = 'grid';
        document.getElementById('emptyState').style.display = 'none';
        
        updatePreview();
        
        // Update active state in tree
        document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.querySelector(`[data-path="${filePath}"]`);
        if (activeItem) activeItem.classList.add('active');
        
        setStatus('ok', 'Conectado a GitHub');
    } catch (err) {
        setStatus('error', `Error: ${err.message}`);
        showToast(`Error al cargar: ${err.message}`, 'error');
    }
}

function updatePreview() {
    const md = document.getElementById('editor').value;
    document.getElementById('preview').innerHTML = simpleMarkdown(md);
}

function simpleMarkdown(md) {
    // Remove frontmatter
    md = md.replace(/^---[\s\S]*?---\n*/m, '');
    
    // Headers
    md = md.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    md = md.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    md = md.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    
    // Code blocks
    md = md.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    
    // Inline code
    md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
    
    // Bold and italic
    md = md.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    md = md.replace(/\*(.+?)\*/g, '<em>$1</em>');
    
    // Links
    md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--accent)">$1</a>');
    
    // Images
    md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;">');
    
    // Blockquotes
    md = md.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
    
    // Tables
    md = md.replace(/\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)*)/g, (match, header, body) => {
        const headers = header.split('|').map(h => `<th>${h.trim()}</th>`).join('');
        const rows = body.trim().split('\n').map(row => {
            const cells = row.split('|').map(c => `<td>${c.trim()}</td>`).join('');
            return `<tr>${cells}</tr>`;
        }).join('');
        return `<table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table>`;
    });
    
    // Lists
    md = md.replace(/^- (.+)$/gm, '<li>$1</li>');
    md = md.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    
    // Checkboxes
    md = md.replace(/\[ \]/g, '☐');
    md = md.replace(/\[x\]/g, '☑');
    
    // Horizontal rules
    md = md.replace(/^---$/gm, '<hr>');
    
    // Paragraphs
    md = md.replace(/\n\n/g, '</p><p>');
    md = '<p>' + md + '</p>';
    
    // Clean up empty paragraphs
    md = md.replace(/<p>\s*<\/p>/g, '');
    md = md.replace(/<p>\s*(<h[1-6]>)/g, '$1');
    md = md.replace(/(<\/h[1-6]>)\s*<\/p>/g, '$1');
    md = md.replace(/<p>\s*(<pre>)/g, '$1');
    md = md.replace(/(<\/pre>)\s*<\/p>/g, '$1');
    md = md.replace(/<p>\s*(<table>)/g, '$1');
    md = md.replace(/(<\/table>)\s*<\/p>/g, '$1');
    md = md.replace(/<p>\s*(<ul>)/g, '$1');
    md = md.replace(/(<\/ul>)\s*<\/p>/g, '$1');
    md = md.replace(/<p>\s*(<blockquote>)/g, '$1');
    md = md.replace(/(<\/blockquote>)\s*<\/p>/g, '$1');
    
    return md;
}

function setStatus(type, text) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    dot.className = 'status-dot' + (type === 'error' ? ' error' : type === 'loading' ? ' loading' : '');
    txt.textContent = text;
}

function showToast(text, type = 'success') {
    const toast = document.getElementById('toast');
    const icon = toast.querySelector('i');
    toast.className = `toast ${type}`;
    icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
    document.getElementById('toastText').textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function openInGitHub() {
    if (!currentFilePath) return;
    window.open(toGitHubEditUrl(currentFilePath), '_blank');
}

function revertChanges() {
    if (!confirm('¿Deshacer todos los cambios?')) return;
    document.getElementById('editor').value = originalContent;
    isModified = false;
    document.getElementById('modifiedBadge').style.display = 'none';
    updatePreview();
    showToast('Cambios revertidos');
}

// ===== SAVE FLOW =====
function saveFile() {
    if (!currentFilePath) return;
    document.getElementById('commitMessage').value = `Update ${currentFilePath}`;
    document.getElementById('commitModal').classList.add('active');
    document.getElementById('commitMessage').focus();
}

function closeModal() {
    document.getElementById('commitModal').classList.remove('active');
}

async function confirmSave() {
    const message = document.getElementById('commitMessage').value.trim();
    if (!message) {
        showToast('Escribe un mensaje de commit', 'error');
        return;
    }

    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

    try {
        const content = document.getElementById('editor').value;
        await saveFileToGitHub(currentFilePath, content, message);
        
        originalContent = content;
        isModified = false;
        document.getElementById('modifiedBadge').style.display = 'none';
        
        closeModal();
        showToast('✅ Guardado. GitHub Actions desplegará los cambios automáticamente.');
        
        setStatus('ok', 'Guardado — deploy en progreso...');
        setTimeout(() => setStatus('ok', 'Conectado a GitHub'), 5000);
    } catch (err) {
        showToast(`Error: ${err.message}`, 'error');
        setStatus('error', `Error: ${err.message}`);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Confirmar';
    }
}

// ===== EVENT LISTENERS =====
document.getElementById('editor').addEventListener('input', () => {
    isModified = true;
    document.getElementById('modifiedBadge').style.display = 'inline';
    updatePreview();
});

// Tab support in textarea
document.getElementById('editor').addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
        e.preventDefault();
        const start = e.target.selectionStart;
        const end = e.target.selectionEnd;
        e.target.value = e.target.value.substring(0, start) + '  ' + e.target.value.substring(end);
        e.target.selectionStart = e.target.selectionEnd = start + 2;
    }
});

// Ctrl+S to save
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if (currentFilePath) saveFile();
    }
});

// Close modal on Escape
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
});

// ===== INIT =====
renderFileTree();
</script>
