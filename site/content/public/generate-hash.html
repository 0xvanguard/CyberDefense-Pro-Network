<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDPN — Generador de Hash PBKDF2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #0a0e1a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #1a1f35; border: 1px solid #1e293b; border-radius: 16px; padding: 2.5rem; width: 90%; max-width: 500px; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 0.875rem 1rem; background: #0d1225; border: 1px solid #1e293b; border-radius: 8px; color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 0.875rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #2563eb; }
        .result { margin-top: 1.5rem; padding: 1rem; background: #0d1225; border: 1px solid #1e293b; border-radius: 8px; display: none; }
        .result label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem; }
        .result code { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; word-break: break-all; color: #10b981; display: block; padding: 0.5rem; background: #0a0e1a; border-radius: 4px; margin-bottom: 0.75rem; }
        .copy-btn { width: auto; padding: 0.5rem 1rem; font-size: 0.8rem; background: #10b981; margin-top: 0.5rem; }
        .warning { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.8rem; color: #f59e0b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Generador de Hash PBKDF2</h1>
        <p>Genera el hash seguro para reemplazar en admin.html</p>
        <div class="warning">
            ⚠️ Usa esta herramienta una sola vez. Después de generar el hash, elimina este archivo.
        </div>
        <input type="password" id="password" placeholder="Escribe tu contraseña admin">
        <button onclick="generate()">Generar Hash PBKDF2</button>
        <div class="result" id="result">
            <label>Salt (hex):</label>
            <code id="saltHex"></code>
            <label>Hash (hex):</label>
            <code id="hashHex"></code>
            <label>Línea completa para admin.html:</label>
            <code id="fullLine"></code>
            <button class="copy-btn" onclick="copyLine()">📋 Copiar línea</button>
        </div>
    </div>
    <script>
        function bufferToHex(buffer) {
            return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function generate() {
            const password = document.getElementById('password').value;
            if (!password) return alert('Escribe una contraseña');

            const iterations = 100000;
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const encoder = new TextEncoder();

            const keyMaterial = await crypto.subtle.importKey(
                'raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits']
            );

            const derivedBits = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
                keyMaterial, 256
            );

            const saltHex = bufferToHex(salt);
            const hashHex = bufferToHex(derivedBits);
            const fullLine = `${iterations}:SHA-256:${saltHex}:${hashHex}`;

            document.getElementById('saltHex').textContent = saltHex;
            document.getElementById('hashHex').textContent = hashHex;
            document.getElementById('fullLine').textContent = fullLine;
            document.getElementById('result').style.display = 'block';
        }

        function copyLine() {
            const line = document.getElementById('fullLine').textContent;
            navigator.clipboard.writeText(line);
            alert('Copiado al portapapeles');
        }
    </script>
</body>
</html>
