version: '3.8'
services:
  kali:
    image: kalilinux/kali-rolling
    container_name: linux-kali
    hostname: kali
    networks:
      red_at:
        ipv4_address: 10.10.10.100
    volumes:
    - ./scripts:/scripts
    tty: true
    stdin_open: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    openssh-client\
      \ \\\n    openssh-server \\\n    net-tools \\\n    iputils-ping \\\n    procps\
      \ \\\n    curl \\\n    && echo 'root:password' | chpasswd \\\n      && echo\
      \ ' usuario:password123' | chpasswd \\\n      && useradd -m -s /bin/bash usuario\
      \ \\\n      && bash\n\"\n"
    deploy: &id001
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
    healthcheck: &id004
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: &id005
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    cap_add:
    - NET_RAW
    - NET_ADMIN
  web-server:
    image: ubuntu:20.04
    container_name: web-server
    hostname: web-server
    networks:
      red_at:
        ipv4_address: 10.10.10.10
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    apache2 \\\
      \n    && echo 'FLAG{l1nux_m4st3r}' > /var/www/html/flag.txt \\\n      && apachectl\
      \ -D FOREGROUND\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  database:
    image: ubuntu:20.04
    container_name: database
    hostname: database
    networks:
      red_at:
        ipv4_address: 10.10.10.20
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    mysql-server\
      \ \\\n    && service mysql start \\\n      && mysql -e \\\"CREATE DATABASE IF\
      \ NOT EXISTS cdpn;\\\" \\\n      && mysql -e \\\"USE cdpn; CREATE TABLE IF NOT\
      \ EXISTS users (id INT, name VARCHAR(50));\\\" \\\n      && mysql -e \\\"USE\
      \ cdpn; INSERT INTO users VALUES (1, 'admin'), (2, 'user');\\\" \\\n      &&\
      \ sleep infinity\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  ssh-server:
    image: ubuntu:20.04
    container_name: ssh-server
    hostname: ssh-server
    networks:
      red_at:
        ipv4_address: 10.10.10.30
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    openssh-server\
      \ \\\n    && mkdir /var/run/sshd \\\n      && echo 'root:password' | chpasswd\
      \ \\\n      && echo ' PermitRootLogin yes' >> /etc/ssh/sshd_config \\\n    \
      \  && /usr/sbin/sshd -D\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
networks:
  red_at:
    driver: bridge
    ipam:
      config:
      - subnet: 10.10.10.0/24
