version: '3.8'
services:
  kali:
    image: kalilinux/kali-rolling
    container_name: sec-kali
    hostname: kali
    networks:
      red_at:
        ipv4_address: 10.10.10.100
    volumes:
    - ./scripts:/scripts
    tty: true
    stdin_open: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    nmap \\\n\
      \    lynis \\\n    auditd \\\n    fail2ban-client \\\n    net-tools \\\n   \
      \ iputils-ping \\\n    curl \\\n    ssh \\\n    && bash\n\"\n"
    deploy: &id001
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
    healthcheck: &id004
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: &id005
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    cap_add:
    - NET_RAW
    - NET_ADMIN
  web-server:
    image: ubuntu:20.04
    container_name: web-server
    hostname: web-server
    networks:
      red_at:
        ipv4_address: 10.10.10.10
    volumes:
    - ./scripts:/scripts
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    apache2 \\\
      \n    iptables \\\n    auditd \\\n    lynis \\\n    && echo 'FLAG{f1r3w4ll_4ct1v3}'\
      \ > /var/www/html/flag.txt \\\n      && apachectl -D FOREGROUND\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  database:
    image: centos:8
    container_name: database
    hostname: database
    networks:
      red_at:
        ipv4_address: 10.10.10.20
    volumes:
    - ./scripts:/scripts
    tty: true
    command: "bash -c \"\n  yum install -y \\\n    mysql-server \\\n    && systemctl\
      \ start mysqld \\\n      && mysql -e \\\"CREATE DATABASE IF NOT EXISTS test;\\\
      \" \\\n      && mysql -e \\\"USE test; CREATE TABLE IF NOT EXISTS users (id\
      \ INT, name VARCHAR(50));\\\" \\\n      && mysql -e \\\"USE test; INSERT INTO\
      \ users VALUES (1, 'admin');\\\" \\\n      && echo 'FLAG{s3l1nux_m4n4g3d}' >\
      \ /root/flag.txt \\\n      && sleep infinity\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  ssh-server:
    image: ubuntu:20.04
    container_name: ssh-server
    hostname: ssh-server
    networks:
      red_at:
        ipv4_address: 10.10.10.30
    volumes:
    - ./scripts:/scripts
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    openssh-server\
      \ \\\n    fail2ban \\\n    && mkdir /var/run/sshd \\\n      && echo 'root:password'\
      \ | chpasswd \\\n      && sed -i 's/#PermitRootLogin yes/PermitRootLogin no/'\
      \ /etc/ssh/sshd_config \\\n      && sed -i 's/#PasswordAuthentication yes/PasswordAuthentication\
      \ no/' /etc/ssh/sshd_config \\\n      && echo 'FLAG{ssh_h4rd3n3d}' > /root/flag.txt\
      \ \\\n      && /usr/sbin/sshd -D\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
networks:
  red_at:
    driver: bridge
    ipam:
      config:
      - subnet: 10.10.10.0/24
