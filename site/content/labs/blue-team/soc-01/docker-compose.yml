# 🔒 SOC Operations Lab - Hardened
# CyberDefense Pro Network
# Security: Resource limits, cap_drop, healthchecks, secure credentials

version: '3.8'

services:
  kali:
    image: kalilinux/kali-rolling
    container_name: ${LAB_NAME:-soc}-kali
    hostname: kali
    networks:
      red_at:
        ipv4_address: 10.0.2.100
    volumes:
      - ./scripts:/scripts:ro
    tty: true
    stdin_open: true
    command: >
      bash -c "
        apt-get update && apt-get install -y \
          nmap \
          netcat \
          curl \
          python3 \
          && bash
      "
    # 🔒 Security
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pgrep", "bash"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: ${LAB_NAME:-soc}-wazuh-manager
    hostname: wazuh-manager
    networks:
      red_at:
        ipv4_address: 10.0.2.10
    ports:
      - "${WAZUH_PORT:-55000}:55000"
      - "1514:1514"
      - "1515:1515"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USER=${WAZUH_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_PASSWORD:-changeme}
      - FILEBEAT_ENABLED=false
    # 🔒 Security
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: ${LAB_NAME:-soc}-wazuh-indexer
    hostname: wazuh-indexer
    networks:
      red_at:
        ipv4_address: 10.0.2.11
    ports:
      - "${INDEXER_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
    # 🔒 Security
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: ${LAB_NAME:-soc}-wazuh-dashboard
    hostname: wazuh-dashboard
    networks:
      red_at:
        ipv4_address: 10.0.2.12
    ports:
      - "${DASHBOARD_PORT:-5601}:5601"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USER=${WAZUH_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_PASSWORD:-changeme}
    # 🔒 Security
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web-server:
    image: vulnerables/web-dvwa
    container_name: ${LAB_NAME:-soc}-web
    hostname: web-server
    networks:
      red_at:
        ipv4_address: 10.0.2.40
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      - MYSQL_PASSWD=${DVWA_PASSWORD:-changeme}
    # 🔒 Security
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  database:
    image: ubuntu:22.04
    container_name: ${LAB_NAME:-soc}-db
    hostname: database
    networks:
      red_at:
        ipv4_address: 10.0.2.50
    tty: true
    command: >
      bash -c "
        apt-get update && apt-get install -y \
          openssh-server \
          mysql-server \
          && mkdir /var/run/sshd \
            && echo '${DB_USER:-admin}:${DB_PASSWORD:-changeme}' | chpasswd \
            && /usr/sbin/sshd -D
      "
    # 🔒 Security
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  red_at:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24
