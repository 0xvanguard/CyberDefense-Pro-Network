version: '3.8'

services:
  kali:
    image: kalilinux/kali-rolling
    container_name: soc-kali
    hostname: kali
    networks:
      red_at:
        ipv4_address: 10.0.2.100
    volumes:
      - ./scripts:/scripts
    tty: true
    stdin_open: true
    command: >
      bash -c "
        apt-get update && apt-get install -y \
          nmap \
          netcat \
          curl \
          python3 \
          && bash
      "

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    networks:
      red_at:
        ipv4_address: 10.0.2.10
    ports:
      - "55000:55000"
      - "1514:1514"
      - "1515:1515"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=admin
      - FILEBEAT_ENABLED=false

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.0
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    networks:
      red_at:
        ipv4_address: 10.0.2.11
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      -插件.install["repository-s3"]

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.0
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    networks:
      red_at:
        ipv4_address: 10.0.2.12
    ports:
      - "5601:5601"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=admin

  web-server:
    image: vulnerables/web-dvwa
    container_name: soc-web
    hostname: web-server
    networks:
      red_at:
        ipv4_address: 10.0.2.40
    ports:
      - "80:80"
    environment:
      - MYSQL_PASSWD=password

  database:
    image: ubuntu:20.04
    container_name: soc-db
    hostname: database
    networks:
      red_at:
        ipv4_address: 10.0.2.50
    tty: true
    command: >
      bash -c "
        apt-get update && apt-get install -y \
          openssh-server \
          mysql-server \
          && mkdir /var/run/sshd \
            && echo 'admin:admin123' | chpasswd \
            && /usr/sbin/sshd -D
      "

networks:
  red_at:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24
