version: '3.8'

services:
  kali:
    image: kalilinux/kali-rolling
    container_name: privesc-kali
    hostname: kali
    networks:
      red_at:
        ipv4_address: 10.0.2.100
    volumes:
      - ./scripts:/scripts
    tty: true
    stdin_open: true
    command: >
      bash -c "
        apt-get update && apt-get install -y \
          nmap \
          netcat \
          curl \
          python3 \
          wget \
          && bash
      "

  linux-privesc:
    image: ubuntu:20.04
    container_name: privesc-linux
    hostname: linux-target
    networks:
      red_at:
        ipv4_address: 10.0.2.10
    volumes:
      - ./scripts:/scripts
    tty: true
    command: >
      bash -c "
        apt-get update && apt-get install -y \
          sudo \
          && useradd -m -s /bin/bash lowuser \
            && echo 'lowuser:lowpass' | chpasswd \
            && echo 'FLAG{pr1v3sc_l1nux}' > /root/flag.txt \
            && chmod 600 /root/flag.txt \
            && echo 'lowuser ALL=(ALL) NOPASSWD: /usr/bin/find' >> /etc/sudoers \
            && find / -perm -4000 -type f 2>/dev/null > /tmp/suid.txt \
            && sleep infinity
      "

  windows-privesc:
    image: vulnerabilities/windows-7-patch497
    container_name: privesc-windows
    hostname: windows-target
    networks:
      red_at:
        ipv4_address: 10.0.2.20

networks:
  red_at:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.2.0/24
