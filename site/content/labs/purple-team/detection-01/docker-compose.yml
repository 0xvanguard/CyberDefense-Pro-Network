version: '3.8'
services:
  kali:
    image: kalilinux/kali-rolling
    container_name: purple-kali
    hostname: kali
    networks:
      purple_net:
        ipv4_address: 10.0.2.100
    volumes:
    - ./scripts:/scripts
    tty: true
    stdin_open: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    nmap \\\n\
      \    netcat \\\n    curl \\\n    python3 \\\n    bloodhound \\\n    crackmapexec\
      \ \\\n    impacket-scripts \\\n    && bash\n\"\n"
    deploy: &id001
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    cap_drop: &id002
    - ALL
    security_opt: &id003
    - no-new-privileges:true
    healthcheck: &id004
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: &id005
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: unless-stopped
    cap_add:
    - NET_RAW
    - NET_ADMIN
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.0
    container_name: purple-wazuh
    hostname: wazuh-manager
    networks:
      purple_net:
        ipv4_address: 10.0.2.150
    ports:
    - 55000:55000
    - 5601:5601
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  windows-target:
    image: vulnerabilities/windows-7-patch497
    container_name: purple-windows
    hostname: windows-target
    networks:
      purple_net:
        ipv4_address: 10.0.2.10
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  linux-target:
    image: ubuntu:20.04
    container_name: purple-linux
    hostname: linux-target
    networks:
      purple_net:
        ipv4_address: 10.0.2.20
    volumes:
    - ./scripts:/scripts
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    openssh-server\
      \ \\\n    auditd \\\n    && mkdir /var/run/sshd \\\n      && echo 'admin:admin123'\
      \ | chpasswd \\\n      && useradd -m -s /bin/bash admin \\\n      && echo 'FLAG{purple_t34m_d3t3ct3d}'\
      \ > /home/admin/flag.txt \\\n      && /usr/sbin/sshd -D\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
  blue-defender:
    image: ubuntu:20.04
    container_name: purple-blue
    hostname: blue-defender
    networks:
      purple_net:
        ipv4_address: 10.0.2.200
    volumes:
    - ./scripts:/scripts
    tty: true
    command: "bash -c \"\n  apt-get update && apt-get install -y \\\n    nmap \\\n\
      \    netcat \\\n    curl \\\n    python3 \\\n    && bash\n\"\n"
    deploy: *id001
    cap_drop: *id002
    security_opt: *id003
    healthcheck: *id004
    logging: *id005
    restart: unless-stopped
networks:
  purple_net:
    driver: bridge
    ipam:
      config:
      - subnet: 10.0.2.0/24
