name: Validate Content

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate structure
        run: |
          echo "📁 Validating repository structure..."
          test -f README.md && echo "✅ README.md exists" || echo "❌ README.md missing"
          test -f LICENSE && echo "✅ LICENSE exists" || echo "❌ LICENSE missing"
          test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md exists" || echo "❌ CONTRIBUTING.md missing"
          test -f docs/app.html && echo "✅ Web app exists" || echo "❌ Web app missing"
          test -f docs/styles.css && echo "✅ Styles exist" || echo "❌ Styles missing"
          test -f docs/script.js && echo "✅ Script exists" || echo "❌ Script missing"
          echo "✅ Structure validation complete"

      - name: Validate HTML
        run: |
          echo "🔍 Checking HTML..."
          grep -c "</html>" docs/app.html && echo "✅ HTML properly closed" || echo "❌ HTML issue"
          echo "✅ HTML validation complete"

      - name: Summary
        run: |
          echo "# 📊 Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All validations passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Thank you for contributing to CyberDefense Pro Network! 🛡️" >> $GITHUB_STEP_SUMMARY
