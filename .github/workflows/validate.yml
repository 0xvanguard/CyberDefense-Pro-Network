name: Validate Content

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "📁 Validating repository structure..."
          for f in README.md LICENSE CONTRIBUTING.md docs/index.html docs/favicon.svg docs/sitemap.xml docs/robots.txt docs/404.html docs/assets/css/a11y.css docs/assets/js/i18n-lang.js; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f MISSING"
              exit 1
            fi
          done
          echo "✅ Structure validation complete"

      - name: Validate HTML metadata
        run: |
          echo "🔍 Checking HTML metadata..."
          failed=0
          for html in $(find docs -name "*.html" -not -path "*/.git/*" -not -path "*/404/*"); do
            echo "── $html"
            grep -qi '<html lang=' "$html" || { echo "  ❌ missing <html lang>"; failed=1; }
            grep -qi '<meta charset=' "$html" || { echo "  ❌ missing charset"; failed=1; }
            grep -qi '<meta name="viewport"' "$html" || { echo "  ❌ missing viewport"; failed=1; }
            grep -q '<title>' "$html" || { echo "  ❌ missing <title>"; failed=1; }
            grep -q '</html>' "$html" || { echo "  ❌ HTML not closed"; failed=1; }
          done
          exit $failed

      - name: Validate XML sitemap
        run: |
          echo "🗺️  Validating sitemap.xml..."
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('docs/sitemap.xml'); print('✅ sitemap.xml is valid XML')"

      - name: Check for duplicate scripts (i18n.js was duplicated historically)
        run: |
          echo "🔁 Checking for duplicate script tags..."
          failed=0
          for html in docs/*.html docs/modules/*/index.html; do
            [ -f "$html" ] || continue
            # `|| true` because grep -c exits 1 when count is 0, and bash -e would kill the step
            count=$(grep -c 'src="[^"]*i18n\.js"' "$html" || true)
            if [ "${count:-0}" -gt 1 ]; then
              echo "❌ $html has $count occurrences of i18n.js"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "✅ No duplicate scripts"

      - name: Validate robots.txt
        run: |
          echo "🤖 Checking robots.txt..."
          grep -q "Sitemap:" docs/robots.txt && echo "✅ sitemap declared" || echo "❌ sitemap missing"
          grep -q "User-agent" docs/robots.txt && echo "✅ user-agent declared" || echo "❌ user-agent missing"

      - name: Check internal links
        run: |
          echo "🔗 Checking internal links (manual docs only)..."
          python3 - <<'PYEOF'
          import os, re, sys
          # Only check hand-crafted HTML files, skip VitePress-generated content
          skip_dirs = {'campus', 'labs', 'roles', '.git'}
          ok, broken = 0, []
          for f in os.listdir('docs'):
              if not f.endswith('.html'): continue
              fp = os.path.join('docs', f)
              with open(fp, encoding='utf-8') as fh:
                  html = fh.read()
              base_dir = os.path.dirname(fp)
              for href in re.findall(r'href="([^"#]+)(?:#[^"]*)?"', html):
                  if href.startswith(('http://', 'https://', 'mailto:', 'tel:', '//')): continue
                  if href.startswith(('$', 'javascript:')): continue
                  if href == '/': continue
                  target = os.path.normpath(os.path.join(base_dir, href.split('#')[0]))
                  if target.endswith('/') or os.path.isdir(target):
                      target = os.path.join(target, 'index.html')
                  elif target.endswith('/index.html'):
                      pass
                  elif not os.path.splitext(target)[1]:
                      target += '.html'
                  if not os.path.exists(target):
                      broken.append((fp, href))
                  else:
                      ok += 1
          print(f"  ✅ {ok} internal links ok")
          if broken:
              print(f"  ❌ {len(broken)} broken internal links:")
              for fp, href in broken[:30]:
                  print(f"     {fp} -> {href}")
              sys.exit(1)
          PYEOF

      - name: Summary
        if: always()
        run: |
          echo "# 📊 Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
