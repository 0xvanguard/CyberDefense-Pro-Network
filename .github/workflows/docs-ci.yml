name: Docs Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check critical READMEs exist
        run: |
          required_files=(
            "02-SEGURIDAD-INFORMACION/01-gestion-riesgos/README.md"
            "02-SEGURIDAD-INFORMACION/05-hardening/README.md"
            "02-SEGURIDAD-INFORMACION/06-compliance-normativas/README.md"
            "02-SEGURIDAD-INFORMACION/07-threat-intelligence/README.md"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              exit 1
            fi
            echo "✅ $f"
          done
      
      - name: Check module READMEs have minimum content
        run: |
          for f in 02-SEGURIDAD-INFORMACION/*/README.md; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              if [ "$lines" -lt 50 ]; then
                echo "⚠️  $f has only $lines lines (minimum 50)"
              else
                echo "✅ $f ($lines lines)"
              fi
            fi
          done
      
      - name: Count total documentation
        run: |
          md_count=$(find . -name "*.md" -not -path "./.git/*" | wc -l)
          echo "📊 Total .md files: $md_count"
          echo "📊 Total files: $(find . -type f -not -path './.git/*' | wc -l)"
