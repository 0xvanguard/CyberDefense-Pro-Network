<!DOCTYPE html>
<html>
<head>
  <title>Generate MedScan Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: white; }
    canvas { border: 1px solid #333; margin: 10px; }
    button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h1>🔍 MedScan Icon Generator</h1>
  <p>Click the button to download all icon sizes.</p>
  
  <canvas id="c128" width="128" height="128"></canvas>
  <canvas id="c48" width="48" height="48"></canvas>
  <canvas id="c16" width="16" height="16"></canvas>
  
  <br>
  <button onclick="downloadIcons()">Download All Icons</button>
  
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const s = size;
      
      // Background circle
      ctx.beginPath();
      ctx.arc(s/2, s/2, s/2 - 2, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      
      // Shield shape
      ctx.beginPath();
      ctx.moveTo(s/2, s * 0.15);
      ctx.lineTo(s * 0.8, s * 0.3);
      ctx.lineTo(s * 0.8, s * 0.55);
      ctx.lineTo(s/2, s * 0.85);
      ctx.lineTo(s * 0.2, s * 0.55);
      ctx.lineTo(s * 0.2, s * 0.3);
      ctx.closePath();
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
      
      // Plus sign (medical)
      ctx.fillStyle = 'white';
      ctx.fillRect(s * 0.42, s * 0.25, s * 0.16, s * 0.5);
      ctx.fillRect(s * 0.25, s * 0.42, s * 0.5, s * 0.16);
      
      // Scan line
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s/2, s/2, s * 0.35, 0, Math.PI * 0.7);
      ctx.stroke();
      
      // Corner dots
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(s * 0.25, s * 0.3, 3, 0, Math.PI * 2);
      ctx.arc(s * 0.75, s * 0.3, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    
    function downloadIcons() {
      drawIcon(document.getElementById('c128'), 128);
      drawIcon(document.getElementById('c48'), 48);
      drawIcon(document.getElementById('c16'), 16);
      
      downloadCanvas('c128', 'icon128.png');
      downloadCanvas('c48', 'icon48.png');
      downloadCanvas('c16', 'icon16.png');
    }
    
    function downloadCanvas(id, filename) {
      const canvas = document.getElementById(id);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Draw on load
    drawIcon(document.getElementById('c128'), 128);
    drawIcon(document.getElementById('c48'), 48);
    drawIcon(document.getElementById('c16'), 16);
  </script>
</body>
</html>
