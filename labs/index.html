<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Labs — CyberDefense Pro Network</title>
    <link rel="stylesheet" href="../docs/assets/css/gamification.css">
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #111128;
            --bg-card: #1a1a3e;
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --accent-purple: #9b59b6;
            --accent-orange: #e67e22;
            --accent-red: #e74c3c;
            --accent-gold: #f1c40f;
            --border: rgba(255,255,255,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== ANIMATED BACKGROUND ===== */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(46, 204, 113, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 204, 113, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .header {
            position: relative;
            z-index: 1;
            padding: 2rem;
            text-align: center;
            background: linear-gradient(180deg, rgba(46, 204, 113, 0.08) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #2ecc71, #3498db, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* ===== XP BANNER ===== */
        .xp-banner {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, rgba(26, 26, 62, 0.9) 0%, rgba(17, 17, 40, 0.9) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 2rem;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .xp-level-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #ffaa00);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #1a1a2e;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
        }

        .xp-level-badge .level-num {
            font-size: 1.8rem;
            line-height: 1;
        }

        .xp-level-badge .level-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .xp-stats {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .xp-stats .stat-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .xp-stats .stat-row .label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            min-width: 100px;
        }

        .xp-stats .stat-row .value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .xp-stats .stat-row .value.gold { color: var(--accent-gold); }
        .xp-stats .stat-row .value.green { color: var(--accent-green); }
        .xp-stats .stat-row .value.blue { color: var(--accent-blue); }
        .xp-stats .stat-row .value.purple { color: var(--accent-purple); }

        .xp-progress-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .xp-progress-section .progress-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .xp-progress-section .progress-bar {
            width: 200px;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .xp-progress-section .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            border-radius: 10px;
            transition: width 1s ease;
        }

        /* ===== STREAK & BADGES ===== */
        .engagement-bar {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .streak-card {
            flex: 1;
            min-width: 200px;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.1), rgba(255, 165, 0, 0.05));
            border: 1px solid rgba(255, 107, 0, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .streak-card .fire { font-size: 2rem; }

        .streak-card .streak-info .count {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff6b00;
        }

        .streak-card .streak-info .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .badges-preview {
            flex: 2;
            min-width: 300px;
            padding: 1rem 1.5rem;
            background: rgba(26, 26, 62, 0.5);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .badges-preview .title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .badges-preview .badges-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badges-preview .badge-chip {
            padding: 0.3rem 0.75rem;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .badges-preview .badge-chip.locked {
            opacity: 0.4;
            filter: grayscale(1);
        }

        /* ===== FILTERS ===== */
        .filters {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.25rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(46, 204, 113, 0.1);
            border-color: rgba(46, 204, 113, 0.3);
            color: var(--accent-green);
        }

        .filter-btn.active {
            background: rgba(46, 204, 113, 0.15);
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        /* ===== LAB GRID ===== */
        .labs-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .difficulty-section {
            margin-bottom: 3rem;
        }

        .difficulty-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .difficulty-header .icon {
            font-size: 1.5rem;
        }

        .difficulty-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .difficulty-header .count {
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0.25rem 0.75rem;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
        }

        .labs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* ===== LAB CARD ===== */
        .lab-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .lab-card:hover {
            transform: translateY(-4px);
            border-color: rgba(46, 204, 113, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .lab-card.completed {
            border-color: rgba(46, 204, 113, 0.4);
        }

        .lab-card.completed::after {
            content: '✅';
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
        }

        .lab-card-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.08), rgba(52, 152, 219, 0.08));
            border-bottom: 1px solid var(--border);
        }

        .lab-card-header .lab-icon {
            font-size: 2rem;
            margin-bottom: 0.75rem;
        }

        .lab-card-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .lab-card-header .lab-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .lab-card-body {
            padding: 1.5rem;
        }

        .lab-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .lab-meta .tag {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag.difficulty {
            background: rgba(241, 196, 15, 0.15);
            color: var(--accent-gold);
        }

        .tag.xp {
            background: rgba(46, 204, 113, 0.15);
            color: var(--accent-green);
        }

        .tag.time {
            background: rgba(52, 152, 219, 0.15);
            color: var(--accent-blue);
        }

        .tag.tools {
            background: rgba(155, 89, 182, 0.15);
            color: var(--accent-purple);
        }

        .lab-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .lab-objectives {
            list-style: none;
            margin-bottom: 1rem;
        }

        .lab-objectives li {
            padding: 0.3rem 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .lab-objectives li::before {
            content: '▸';
            color: var(--accent-green);
            font-weight: bold;
        }

        .lab-card-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lab-progress-bar {
            flex: 1;
            margin-right: 1rem;
        }

        .lab-progress-bar .bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .lab-progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
            border-radius: 6px;
            transition: width 0.5s;
        }

        .lab-progress-bar .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.3rem;
        }

        .start-btn {
            padding: 0.5rem 1.25rem;
            background: linear-gradient(135deg, var(--accent-green), #27ae60);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.4);
        }

        .start-btn.completed {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.2), rgba(46, 204, 113, 0.1));
            cursor: default;
        }

        /* ===== RECOMMENDED PATH ===== */
        .recommended-path {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .path-card {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.1), rgba(52, 152, 219, 0.1));
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-radius: 16px;
            padding: 2rem;
        }

        .path-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .path-steps {
            display: flex;
            gap: 0;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .path-step {
            flex-shrink: 0;
            text-align: center;
            padding: 1rem;
            min-width: 120px;
            position: relative;
        }

        .path-step::after {
            content: '→';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        .path-step:last-child::after {
            display: none;
        }

        .path-step .step-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.5rem;
            font-size: 1.2rem;
        }

        .path-step.done .step-icon {
            background: rgba(46, 204, 113, 0.2);
            border-color: var(--accent-green);
        }

        .path-step.current .step-icon {
            background: rgba(52, 152, 219, 0.2);
            border-color: var(--accent-blue);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(52, 152, 219, 0); }
        }

        .path-step .step-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .xp-banner { grid-template-columns: 1fr; text-align: center; }
            .xp-level-badge { margin: 0 auto; }
            .labs-grid { grid-template-columns: 1fr; }
            .path-steps { flex-direction: column; align-items: center; }
            .path-step::after { display: none; }
        }
    </style>
</head>

    <div class="bg-grid"></div>

    <!-- HEADER -->

    <!-- ENGAGEMENT BAR -->
    <div class="engagement-bar">

        <button class="filter-btn" data-filter="intermedio">🟡 Intermedio</button>
        <button class="filter-btn" data-filter="avanzado">🟠 Avanzado</button>
        <button class="filter-btn" data-filter="expert">🔴 Expert</button>
        <button class="filter-btn" data-filter="completed">✅ Completados</button>
        <button class="filter-btn" data-filter="pending">⬜ Pendientes</button>

        </div>
    </div>

    <!-- LABS GRID -->
    <div class="labs-container" id="labs-container">

    </div>

    // ===== RENDER FUNCTIONS =====
    function renderLabs(filter = 'all') {
        const container = document.getElementById('labs-container');
        const gamData = CDPN_Gamification.data;
        const completedLabs = gamData.labsCompleted || [];

        let filteredLabs = LABS;
        if (filter === 'completed') {
            filteredLabs = LABS.filter(l => completedLabs.includes(l.id));
        } else if (filter === 'pending') {
            filteredLabs = LABS.filter(l => !completedLabs.includes(l.id));
        } else if (filter !== 'all') {
            filteredLabs = LABS.filter(l => l.difficulty === filter);
        }

        // Group by difficulty
        const grouped = {};
        filteredLabs.forEach(lab => {
            if (!grouped[lab.difficulty]) grouped[lab.difficulty] = [];
            grouped[lab.difficulty].push(lab);
        });

        container.textContent = '';
        const order = ['fundamentos', 'intermedio', 'avanzado', 'expert'];

        if (filteredLabs.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.style.cssText = 'text-align:center;padding:4rem;color:var(--text-secondary)';
            const emptyIcon = document.createElement('div');
            emptyIcon.style.cssText = 'font-size:3rem;margin-bottom:1rem';
            emptyIcon.textContent = '🔍';
            const emptyP = document.createElement('p');
            emptyP.textContent = 'No hay labs que mostrar con este filtro.';
            emptyDiv.appendChild(emptyIcon);
            emptyDiv.appendChild(emptyP);
            container.appendChild(emptyDiv);
            return;
        }

        order.forEach(diff => {
            if (!grouped[diff] || grouped[diff].length === 0) return;
            const config = DIFFICULTIES[diff];

            const section = document.createElement('div');
            section.className = 'difficulty-section';
            section.dataset.difficulty = diff;

            const header = document.createElement('div');
            header.className = 'difficulty-header';
            const iconSpan = document.createElement('span');
            iconSpan.className = 'icon';
            iconSpan.textContent = config.icon;
            const h2 = document.createElement('h2');
            h2.textContent = config.label;
            const countSpan = document.createElement('span');
            countSpan.className = 'count';
            countSpan.textContent = grouped[diff].length + ' labs';
            header.appendChild(iconSpan);
            header.appendChild(h2);
            header.appendChild(countSpan);
            section.appendChild(header);

            const grid = document.createElement('div');
            grid.className = 'labs-grid';

            grouped[diff].forEach(lab => {
                const isCompleted = completedLabs.includes(lab.id);
                const card = document.createElement('div');
                card.className = 'lab-card' + (isCompleted ? ' completed' : '');
                card.dataset.labId = lab.id;
                card.onclick = () => openLab(lab.path);

                const cardHeader = document.createElement('div');
                cardHeader.className = 'lab-card-header';
                const labIcon = document.createElement('div');
                labIcon.className = 'lab-icon';
                labIcon.textContent = lab.icon;
                const labName = document.createElement('h3');
                labName.textContent = lab.name;
                const labSubtitle = document.createElement('div');
                labSubtitle.className = 'lab-subtitle';
                labSubtitle.textContent = lab.subtitle;
                cardHeader.appendChild(labIcon);
                cardHeader.appendChild(labName);
                cardHeader.appendChild(labSubtitle);

                const cardBody = document.createElement('div');
                cardBody.className = 'lab-card-body';
                const meta = document.createElement('div');
                meta.className = 'lab-meta';
                const tagDiff = document.createElement('span');
                tagDiff.className = 'tag difficulty';
                tagDiff.textContent = config.icon + ' ' + config.label;
                const tagXp = document.createElement('span');
                tagXp.className = 'tag xp';
                tagXp.textContent = '⚡ ' + lab.xp + ' XP';
                const tagTime = document.createElement('span');
                tagTime.className = 'tag time';
                tagTime.textContent = '⏱️ ' + lab.time;
                meta.appendChild(tagDiff);
                meta.appendChild(tagXp);
                meta.appendChild(tagTime);
                const desc = document.createElement('p');
                desc.className = 'lab-description';
                desc.textContent = lab.subtitle;
                const objectives = document.createElement('ul');
                objectives.className = 'lab-objectives';
                lab.objectives.forEach(o => {
                    const li = document.createElement('li');
                    li.textContent = o;
                    objectives.appendChild(li);
                });
                cardBody.appendChild(meta);
                cardBody.appendChild(desc);
                cardBody.appendChild(objectives);

                const cardFooter = document.createElement('div');
                cardFooter.className = 'lab-card-footer';
                const progressBar = document.createElement('div');
                progressBar.className = 'lab-progress-bar';
                const bar = document.createElement('div');
                bar.className = 'bar';
                const fill = document.createElement('div');
                fill.className = 'fill';
                fill.style.width = (isCompleted ? 100 : 0) + '%';
                bar.appendChild(fill);
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = isCompleted ? '✅ Completado' : '⬜ No iniciado';
                progressBar.appendChild(bar);
                progressBar.appendChild(label);
                const startBtn = document.createElement('button');
                startBtn.className = 'start-btn' + (isCompleted ? ' completed' : '');
                startBtn.textContent = isCompleted ? 'Revisar' : 'Iniciar Lab';
                cardFooter.appendChild(progressBar);
                cardFooter.appendChild(startBtn);

                card.appendChild(cardHeader);
                card.appendChild(cardBody);
                card.appendChild(cardFooter);
                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    function updateXPBanner() {
        const stats = CDPN_Gamification.getStats();
        document.getElementById('user-level').textContent = stats.level;
        document.getElementById('user-xp').textContent = `${stats.xp.toLocaleString()} XP`;
        document.getElementById('user-rank').textContent = `${stats.rank.icon} ${stats.rank.name}`;
        document.getElementById('labs-done').textContent = `${stats.labsCompleted} / ${LABS.length}`;
        document.getElementById('badges-count').textContent = `${stats.badges} / ${ALL_BADGES.length}`;
        document.getElementById('progress-label').textContent = `${stats.xpForNextLevel} XP para nivel ${stats.level + 1}`;
        document.getElementById('progress-fill').style.width = `${stats.levelProgress}%`;
        document.getElementById('streak-count').textContent = `${stats.streak} día${stats.streak !== 1 ? 's' : ''}`;
    }

    function renderBadges() {
        const gamData = CDPN_Gamification.data;
        const earned = gamData.badges || [];
        const container = document.getElementById('badges-row');

        container.textContent = '';
        ALL_BADGES.forEach(badge => {
            const isEarned = earned.includes(badge.id);
            const chip = document.createElement('span');
            chip.className = 'badge-chip' + (isEarned ? '' : ' locked');
            chip.title = badge.name;
            chip.textContent = badge.icon + ' ' + badge.name;
            container.appendChild(chip);
        });
    }

    function renderLearningPath() {
        const completedLabs = CDPN_Gamification.data.labsCompleted || [];
        const pathOrder = ['net-01', 'recon-01', 'vulnscan-01', 'web-01', 'webapp-01', 'pentest-01', 'privesc-01', 'ad-01', 'malware-01'];
        const container = document.getElementById('learning-path');

        container.textContent = '';
        let foundCurrent = false;

        pathOrder.forEach((labId, i) => {
            const lab = LABS.find(l => l.id === labId);
            if (!lab) return;

            const isDone = completedLabs.includes(labId);
            const isCurrent = !isDone && !foundCurrent;
            if (isCurrent) foundCurrent = true;

            const step = document.createElement('div');
            step.className = 'path-step' + (isDone ? ' done' : '') + (isCurrent ? ' current' : '');
            const stepIcon = document.createElement('div');
            stepIcon.className = 'step-icon';
            stepIcon.textContent = lab.icon;
            const stepName = document.createElement('div');
            stepName.className = 'step-name';
            stepName.textContent = lab.name.split(' ').slice(0, 2).join(' ');
            step.appendChild(stepIcon);
            step.appendChild(stepName);
            container.appendChild(step);
        });
    }

    // Labs with interactive versions (all 20)
    const INTERACTIVE_LABS = ['net-01', 'recon-01', 'pentest-01', 'webapp-01', 'privesc-01', 'vulnscan-01', 'web-01', 'crypto-01', 'disk-forensics-01', 'persist-01', 'social-01', 'lateral-01', 'ad-01', 'malware-01', 'cloud-01', 'forensics-01', 'reverse-eng-01', 'net-forensics-01', 'incident-01', 'malware-expert-01'];

    function openLab(path) {
        const labId = path.split('/').pop();
        if (INTERACTIVE_LABS.includes(labId)) {
            window.open(`${path}/index.html`, '_blank');
        } else {
            window.open(`${path}/README.md`, '_blank');
        }
    }

    // ===== FILTERS =====
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLabs(btn.dataset.filter);
        });
    });

    // ===== INIT =====
    function init() {
        CDPN_Gamification.init();
        updateXPBanner();
        renderBadges();
        renderLearningPath();
        renderLabs();
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
