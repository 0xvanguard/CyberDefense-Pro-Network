<body><div class="lab-page" id="lab-page"></div><script src="../../docs/assets/js/gamification.js"></script><script src="../../assets/js/lab-runner.js"></script>
<script>const LAB_CONFIG={id:'net-forensics-01',name:'Network Forensics',subtitle:'Analiza tráfico de red para investigar incidentes',icon:'🌐',difficulty:'avanzado',totalXP:350,time:'70 min',exercises:[
{title:'PCAP Analysis',xp:70,objective:'Analiza un archivo pcap con tshark.',steps:['Abre el pcap','Filtra por protocolo','Extrae flujo de conversaciones'],code:'$ tshark -r incident.pcap -q -z conv,tcp\n$ tshark -r incident.pcap -Y "http" -T fields -e ip.src -e http.host\n$ tshark -r incident.pcap -q -z follow,tcp,ascii,0',codeLang:'bash',flag:'FLAG{pcap_analyzed}',hint:'conv,tcp muestra conversaciones. follow stream muestra el contenido completo.',solution:'150 conversaciones TCP. 25 HTTP requests. 1 reverse shell en stream #42.'},
{title:'Protocol Analysis',xp:70,objective:'Identifica protocolos y servicios en el tráfico.',steps:['Enumera protocolos','Analiza DNS queries','Revisa HTTPS (SNI)'],code:'$ tshark -r incident.pcap -q -z io,phs\n$ tshark -r incident.pcap -Y "dns" -T fields -e dns.qry.name\n$ tshark -r incident.pcap -Y "tls.handshake.extensions_server_name" -T fields -e tls.handshake.extensions_server_name',codeLang:'bash',flag:'FLAG{protocols_identified}',hint:'io,phs muestra distribución de protocolos. DNS queries revelan dominios. SNI muestra TLS hosts.',solution:'HTTP 40%, DNS 25%, TLS 20%, Other 15%. 20 dominios C2 en DNS. 15 hosts TLS.'},
{title:'Extraction',xp:70,objective:'Extrae archivos y datos del tráfico.',steps:['Extrae objetos HTTP','Recupera archivos','Analiza el contenido'],code:'$ tshark -r incident.pcap --export-objects http,exported/\n$ file exported/*\n$ binwalk -e exported/suspicious.exe',codeLang:'bash',flag:'FLAG{artifacts_extracted}',hint:'--export-objects http extrae todos los archivos descargados por HTTP.',solution:'15 archivos extraídos. 1 reverse shell.exe, 3 scripts .ps1, 11 imágenes.'},
{title:'C2 Detection',xp:70,objective:'Detecta comunicación C2 en el tráfico.',steps:['Identifica beaconing','Analiza intervalos','Extrae IOCs'],code:'$ tshark -r incident.pcap -Y "http.request" -T fields -e frame.time -e ip.dst | sort -u\n# Beaconing every 60 seconds\n# C2: http://evil.com/beacon\n# User-Agent: Mozilla/5.0 (custom)',codeLang:'bash',flag:'FLAG{c2_detected}',hint:'El beaconing se detecta por intervalos regulares. El C2 usa HTTP GET con user-agent custom.',solution:'Beaconing detectado cada 60 segundos. C2: evil.com. 50 beacons en captura.'},
{title:'Network Forensics Report',xp:70,objective:'Documenta el análisis de forense de red.',steps:['Resume hallazgos','Documenta C2','Incluye IOCs'],code:'## Network Forensics Report\n## Capture: incident.pcap (50MB)\n## Duration: 2 hours\n## C2: evil.com (HTTP beaconing)\n## Extracted: 15 files (1 malware)\n## IOC: 185.100.87.42, evil.com',codeLang:'markdown',flag:'FLAG{net_forensics_report}',hint:'El reporte debe incluir: captura, duración, protocolos, C2, archivos, IOCs.',solution:'Reporte completo con análisis de tráfico, detección C2 y artefactos extraídos.'}
]};document.addEventListener('DOMContentLoaded',()=>{CDPN_LabRunner.init(LAB_CONFIG)});</script></body></html>
