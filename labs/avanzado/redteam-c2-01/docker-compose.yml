version: '3.8'

services:
  # ── RED TEAM: Attacker Machine ──
  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    container_name: redteam-attacker
    networks:
      redteam-net:
        ipv4_address: 10.0.30.10
    volumes:
      - shared-data:/shared
    depends_on:
      - c2-server
    tty: true

  # ── C2: Redirector (Nginx) ──
  redirector:
    image: nginx:alpine
    container_name: redteam-redirector
    ports:
      - "8443:443"
    volumes:
      - ./redirector/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./redirector/certs:/etc/nginx/certs:ro
    networks:
      redteam-net:
        ipv4_address: 10.0.30.20
    depends_on:
      - c2-server

  # ── C2: Sliver Server ──
  c2-server:
    build:
      context: .
      dockerfile: c2-server/Dockerfile
    container_name: redteam-c2
    networks:
      redteam-net:
        ipv4_address: 10.0.30.30
    volumes:
      - shared-data:/shared
    ports:
      - "8443:8443"
    tty: true

  # ── TARGET: Windows Victim ──
  target:
    image: mfriesen/windows-docker:latest
    container_name: redteam-target
    networks:
      redteam-net:
        ipv4_address: 10.0.30.40
    volumes:
      - shared-data:/shared
    ports:
      - "3389:3389"
    tty: true

  # ── BLUE TEAM: Wazuh SIEM ──
  wazuh:
    image: wazuh/wazuh-manager:4.7
    container_name: redteam-wazuh
    networks:
      redteam-net:
        ipv4_address: 10.0.30.50
    ports:
      - "5601:5601"
      - "1514:1514"
      - "1515:1515"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - FILEBEAT_ENABLED=true

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7
    container_name: redteam-indexer
    networks:
      redteam-net:
        ipv4_address: 10.0.30.60
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7
    container_name: redteam-dashboard
    networks:
      redteam-net:
        ipv4_address: 10.0.30.70
    ports:
      - "5601:5601"
    environment:
      - WAZUH_MANAGER_URL=https://wazuh:1515
      - INDEXER_URL=https://wazuh-indexer:9200

networks:
  redteam-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.30.0/24

volumes:
  shared-data:
    driver: local
