server {
    listen 443 ssl;
    server_name redirector.lab.local;
    
    ssl_certificate /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    
    # Traffic filtering — only allow C2 traffic
    location / {
        proxy_pass https://10.0.30.30:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Logging
        access_log /var/log/nginx/c2-access.log;
        error_log /var/log/nginx/c2-error.log;
    }
}
