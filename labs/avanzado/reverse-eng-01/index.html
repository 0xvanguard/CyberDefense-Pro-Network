<script>const LAB_CONFIG={id:'reverse-eng-01',name:'Reverse Engineering',subtitle:'Desensambla y analiza binarios protegidos',icon:'🔧',difficulty:'avanzado',totalXP:450,time:'90 min',exercises:[
{title:'Binary Analysis',xp:80,objective:'Analiza la estructura del binario.',steps:['Identifica el tipo de archivo','Analiza imports/exports','Busca strings'],code:'$ file binary\n$ strings binary | head -50\n$ objdump -d binary | head -100\n$ readelf -a binary',codeLang:'bash',flag:'FLAG{binary_analyzed}',hint:'file identifica tipo. strings busca texto. objdump muestra ensamblador. readelf analiza ELF.',solution:'ELF 64-bit. Imports: printf, malloc, encryption. Strings: "Enter key:", "Correct!", "Wrong!".'},
{title:'Debugging',xp:90,objective:'Debuga el binario para entender su lógica.',steps:['Carga en gdb','Establece breakpoints','Analiza el flow'],code:'$ gdb ./binary\n(gdb) break main\n(gdb) run\n(gdb) disassemble main\n(gdb) break *0x401234\n(gdb) continue',codeLang:'bash',flag:'FLAG{debugging_complete}',hint:'break main pausa en entry. disassemble muestra código. break *addr pausa en dirección específica.',solution:'Main: pide key → compara con hash → imprime "Correct!" si coincide.'},
{title:'Anti-Analysis Bypass',xp:90,objective:'Bypass protecciones anti-debug y anti-VM.',steps:['Identifica checks de sandbox','NOP las instrucciones','Verifica bypass'],code:'# Anti-debug: ptrace check\n# Bypass: NOP the call\n# 0x401000: call ptrace → 0x401000: nop nop nop nop nop\n# Anti-VM: CPUID check\n# Bypass: patch je to jmp',codeLang: 'text', flag:'FLAG{anti_analysis_bypassed}', hint:'NOP (0x90) reemplaza instrucciones. Cambia saltos condicionales para evadir checks.', solution:'2 anti-analysis checks bypassed: ptrace y CPUID. Binary ejecuta correctamente.'},
{title:'Keygen',xp:100,objective:'Crea un keygen que genere keys válidas.',steps:['Analiza el algoritmo de validación','Implementa el algoritmo inverso','Genera keys'],code:'#!/usr/bin/env python3\nimport hashlib\nfor i in range(1000000):\n    key = f"KEY-{i:06d}"\n    if hashlib.md5(key.encode()).hexdigest()[:8] == "a1b2c3d4":\n        print(f"Valid key: {key}")', codeLang:'python', flag:'FLAG{keygen_working}', hint:'Analiza cómo el binary valida la key. Reproduce el algoritmo en Python.', solution:'Keygen funcional. Key válida: KEY-004523. Algoritmo: MD5 hash prefix match.'},
