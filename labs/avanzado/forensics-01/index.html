<body><div class="lab-page" id="lab-page"></div><script src="../../docs/assets/js/gamification.js"></script><script src="../../assets/js/lab-runner.js"></script>
<script>const LAB_CONFIG={id:'forensics-01',name:'Forensics Avanzado',subtitle:'Análisis forense de memoria, disco y red',icon:'🔬',difficulty:'avanzado',totalXP:400,time:'80 min',exercises:[
{title:'Memory Forensics',xp:80,objective:'Analiza un dump de memoria con Volatility.',steps:['Carga el dump en Volatility','Identifica procesos','Busca inyecciones'],code:'$ volatility -f memdump.raw imageinfo\n$ volatility -f memdump.raw --profile=Win7SP1x64 pslist\n$ volatility -f memdump.raw --profile=Win7SP1x64 malfind',codeLang:'bash',flag:'FLAG{memory_forensics_done}',hint:'imageinfo detecta el OS. pslist lista procesos. malfind detecta código inyectado.',solution:'3 procesos sospechosos. 1 inyección de código en explorer.exe. Shellcode detectado.'},
{title:'Disk Forensics',xp:80,objective:'Analiza una imagen de disco con Sleuth Kit.',steps:['Monta la imagen','Enumera archivos','Recupera eliminados'],code:'$ mmls disk.img\n$ fls -r -d /dev/sda2 | grep -i "secret\\|password\\|key"\n$ photorec disk.img',codeLang:'bash',flag:'FLAG{disk_evidence_found}',hint:'mmls muestra particiones. fls lista archivos. photorec recupera archivos eliminados.',solution:'Partición NTFS. 3 archivos eliminados recuperados: password.txt, keys.docx, secrets.zip.'},
{title:'Network Forensics',xp:80,objective:'Analiza capturas de red con Wireshark/tshark.',steps:['Abre el pcap','Filtra tráfico sospechoso','Extrae archivos'],code:'$ tshark -r traffic.pcap -Y "http.request" -T fields -e http.host -e http.request.uri\n$ tshark -r traffic.pcap -Y "dns" -T fields -e dns.qry.name\n$ binwalk -e suspicious_file',codeLang:'bash',flag:'FLAG{network_artifacts_extracted}',hint:'Filtra HTTP requests para ver URLs. DNS queries revelan dominios C2. binwalk extrae archivos embebidos.',solution:'15 HTTP requests a C2. 20 DNS queries a evil.com. 1 reverse shell binario extraído.'},
{title:'Timeline Analysis',xp:80,objective:'Crea un timeline de eventos del incidente.',steps:['Crea timeline de filesystem','Correlaciona con logs','Identifica la secuencia'],code:'$ fls -r -m "/" disk.img > bodyfile.txt\n$ mactime -b bodyfile.txt -d > timeline.csv\n$ cat timeline.csv | grep "2024-01-15"',codeLang:'bash',flag:'FLAG{timeline_complete}',hint:'mactime convierte bodyfile en timeline legible. Filtra por fecha del incidente.',solution:'Timeline: 10:00 initial access, 10:15 privilege escalation, 10:30 data exfil, 11:00 cleanup.'},
{title:'Forensics Report',xp:80,objective:'Documenta el análisis forense completo.',steps:['Resume evidencia','Crea timeline','Incluye conclusiones'],code:'## Forensics Report\n## Incident Date: 2024-01-15\n## Timeline: Access → Privesc → Exfil → Cleanup\n## Evidence: memory dump, disk image, pcap\n## Conclusion: APT group confirmed',codeLang:'markdown',flag:'FLAG{forensics_report_complete}',hint:'El reporte debe incluir: fecha, timeline, evidencia, hallazgos, conclusiones, IOC.',solution:'Reporte forense completo documentando todo el ciclo del incidente.'}
]};document.addEventListener('DOMContentLoaded',()=>{CDPN_LabRunner.init(LAB_CONFIG)});</script></body></html>
