[global]
    workgroup = CORP
    realm = CORP.LOCAL
    netbios name = DC01
    server role = active directory domain controller
    dns forwarder = 8.8.8.8
    idmap_ldb:use rfc2307 = yes

    # Security settings
    server min protocol = SMB2
    ntlm auth = yes
    lanman auth = yes

    # Logging
    log file = /var/log/samba/log.%m
    max log size = 1000
    log level = 2

[netlogon]
    path = /var/lib/samba/sysvol/corp.local/scripts
    read only = No

[sysvol]
    path = /var/lib/samba/sysvol
    read only = No

[shared]
    path = /data/shared
    browsable = yes
    read only = no
    guest ok = no

[confidential]
    path = /data/confidential
    browsable = yes
    read only = no
    guest ok = no
