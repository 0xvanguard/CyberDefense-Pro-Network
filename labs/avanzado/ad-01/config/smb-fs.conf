[global]
    workgroup = CORP
    server string = FS01
    security = user
    map to guest = bad user
    log file = /var/log/samba/log.%m
    max log size = 1000

[shared]
    path = /data/shared
    browsable = yes
    read only = no
    guest ok = no

[confidential]
    path = /data/confidential
    browsable = yes
    read only = no
    guest ok = no

[public]
    path = /data/public
    browsable = yes
    read only = yes
    guest ok = yes
