version: '3.8'

services:
  cloud-lab:
    image: amazon/aws-cli:latest
    container_name: cloud-security-lab
    hostname: cloud-lab
    networks:
      cloud-net:
        ipv4_address: 10.0.6.10
    volumes:
      - ./config:/root/.aws:ro
      - ./scripts:/scripts
      - ./output:/output
    environment:
      # REQUIRED: Set your own credentials before running
      # export AWS_ACCESS_KEY_ID=your_access_key
      # export AWS_SECRET_ACCESS_KEY=your_secret_key
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?ERROR: Set AWS_ACCESS_KEY_ID before running}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?ERROR: Set AWS_SECRET_ACCESS_KEY before running}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: /bin/bash

  localstack:
    image: localstack/localstack:latest
    container_name: localstack-aws
    hostname: localstack
    ports:
      - "4566:4566"
    networks:
      cloud-net:
        ipv4_address: 10.0.6.20
    environment:
      - SERVICES=s3,iam,sts,cloudtrail,guardduty,secretsmanager
      - DEFAULT_REGION=us-east-1

networks:
  cloud-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.6.0/24
