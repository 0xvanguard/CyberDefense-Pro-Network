<script>const LAB_CONFIG={id:'cloud-01',name:'Cloud Security',subtitle:'Audita y explota entornos AWS/Azure/GCP',icon:'☁️',difficulty:'avanzado',totalXP:400,time:'80 min',exercises:[
{title:'IAM Enumeration',xp:70,objective:'Enumera usuarios, roles y políticas IAM.',steps:['Configura AWS CLI','Enumera usuarios IAM','Analiza políticas'],code:'$ aws iam list-users\n$ aws iam list-roles\n$ aws iam get-account-authorization-details',codeLang:'bash',flag:'FLAG{iam_enum_complete}',hint:'aws iam list-users lista usuarios. get-account-authorization-details da el panorama completo.',solution:'12 usuarios, 8 roles, 15 políticas descubiertos.'},
{title:'S3 Bucket Enumeration',xp:70,objective:'Encuentra buckets S3 accesibles y datos expuestos.',steps:['Lista buckets','Verifica permisos','Descarga datos'],code:'$ aws s3 ls\n$ aws s3api get-bucket-acl --bucket target-bucket\n$ aws s3 cp s3://target-bucket/ ./dump --recursive',codeLang:'bash',flag:'FLAG{s3_data_exposed}',hint:'s3 ls lista buckets. get-bucket-acl verifica permisos. cp descarga contenido.',solution:'Bucket "corp-backups" con ACL público. 50GB de datos descargados.'},

{title:'CloudTrail Analysis',xp:80,objective:'Analiza logs de CloudTrail para detectar actividad maliciosa.',steps:['Descarga logs','Filtra eventos SOSPECHOSOS','Identifica IOCs'],code:'$ aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=ConsoleLogin\n$ cat events.json | jq \'.Events[] | select(.EventName | contains("Create"))\'',codeLang:'bash',flag:'FLAG{cloudtrail_analyzed}',hint:'CloudTrail registra todas las API calls. Filtra por eventos sospechosos como CreateAccessKey.',solution:'3 eventos sospechosos: CreateAccessKey, AssumeRole, PutUserPolicy. IOC: IP 185.x.x.x.'},
