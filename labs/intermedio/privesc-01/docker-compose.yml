version: '3.8'

services:
  privesc-lab:
    build: .
    container_name: privesc-lab
    hostname: vulnerable
    networks:
      privesc-net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./solutions:/solutions:ro
      - ./scripts:/scripts
    stdin_open: true
    tty: true
    cap_add:
      - ALL

networks:
  privesc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
