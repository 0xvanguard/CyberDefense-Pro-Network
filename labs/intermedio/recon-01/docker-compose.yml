version: '3.8'

services:
  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: recon-attacker
    hostname: kali
    networks:
      recon-net:
        ipv4_address: 10.0.1.100
    volumes:
      - ./solutions:/solutions:ro
      - ./scripts:/scripts:ro
      - ./validation:/validation
    stdin_open: true
    tty: true
    depends_on:
      - webserver
      - mailserver
      - ftpserver
      - database

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: recon-webserver
    hostname: webserver
    networks:
      recon-net:
        ipv4_address: 10.0.1.10

  mailserver:
    image: namshi/smtp:latest
    container_name: recon-mailserver
    hostname: mailserver
    networks:
      recon-net:
        ipv4_address: 10.0.1.20

  ftpserver:
    image: stilliard/pure-ftpd:hardened
    container_name: recon-ftpserver
    hostname: ftpserver
    networks:
      recon-net:
        ipv4_address: 10.0.1.30
    environment:
      PUBLICHOST: "10.0.1.30"
      FTP_USER_NAME: ${FTP_USER_NAME:-labuser}
      FTP_USER_PASS: ${FTP_USER_PASS:-changeme}
      FTP_USER_HOME: /home/labuser
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "21"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

  database:
    image: mysql:8.0
    container_name: recon-database
    hostname: database
    networks:
      recon-net:
        ipv4_address: 10.0.1.40
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-corpnet_db}
      MYSQL_USER: ${MYSQL_USER:-webapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

networks:
  recon-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
