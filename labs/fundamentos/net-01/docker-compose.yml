version: '3.8'

services:
  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: kali-attacker
    hostname: kali
    networks:
      lab-net:
        ipv4_address: 10.10.10.100
    volumes:
      - ./solutions:/solutions:ro
      - ./scripts:/scripts:ro
      - ./validation:/validation
    stdin_open: true
    tty: true
    depends_on:
      - router
      - webserver
      - database
      - ftpserver

  router:
    image: networkboot/dhcpd
    container_name: lab-router
    hostname: router
    networks:
      lab-net:
        ipv4_address: 10.10.10.1
    cap_add:
      - NET_ADMIN

  webserver:
    image: httpd:2.4
    container_name: lab-webserver
    hostname: webserver
    networks:
      lab-net:
        ipv4_address: 10.10.10.10
    volumes:
      - ./assets/webserver:/usr/local/apache2/htdocs/

  database:
    image: mysql:8.0
    container_name: lab-database
    hostname: database
    networks:
      lab-net:
        ipv4_address: 10.10.10.20
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testdb}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  ftpserver:
    image: stilliard/pure-ftpd
    container_name: lab-ftpserver
    hostname: ftpserver
    networks:
      lab-net:
        ipv4_address: 10.10.10.30
    environment:
      PUBLICHOST: "10.10.10.30"
      FTP_USER_NAME: ${FTP_USER_NAME:-labuser}
      FTP_USER_PASS: ${FTP_USER_PASS:-changeme}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "21"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    restart: unless-stopped

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
